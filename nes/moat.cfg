# Moat NES: MMC1 (mapper 1), 128K PRG (7 swappable 16K banks + 1 fixed), 8K CHR, 8K battery WRAM.
SYMBOLS { __STACKTOP__: type = export, value = $0800; }
MEMORY {
  ZP:     start = $0002, size = $00FE, type = rw;
  OAMR:   start = $0200, size = $0100, type = rw;
  VBUF:   start = $0300, size = $0100, type = rw;
  SCRN:   start = $0400, size = $02C0, type = rw;
  HDR:    start = $0000, size = $0010, file = %O, fill = yes;
  BANK0:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
  BANK1:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
  BANK2:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
  BANK3:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
  BANK4:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
  BANK5:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
  BANK6:  start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
  FIXED:  start = $C000, size = $3FFA, file = %O, fill = yes, fillval = $FF;
  VEC:    start = $FFFA, size = $0006, file = %O, fill = yes;
  CHR:    start = $0000, size = $4000, file = %O, fill = yes;
  WRAM:   start = $6000, size = $2000, type = rw;
}
SEGMENTS {
  ZEROPAGE: load = ZP,   type = zp;
  OAM:      load = OAMR, type = bss, align = 256;
  VBUF:     load = VBUF, type = bss;
  SCREEN:   load = SCRN, type = bss;
  HEADER:   load = HDR,  type = ro;
  BANK0:    load = BANK0, type = ro, optional = yes;
  BANK0R:   load = BANK0, type = ro, optional = yes;
  BANK1:    load = BANK1, type = ro, optional = yes;
  BANK1R:   load = BANK1, type = ro, optional = yes;
  BANK2:    load = BANK2, type = ro, optional = yes;
  BANK2R:   load = BANK2, type = ro, optional = yes;
  BANK3:    load = BANK3, type = ro, optional = yes;
  BANK3R:   load = BANK3, type = ro, optional = yes;
  BANK4:    load = BANK4, type = ro, optional = yes;
  BANK4R:   load = BANK4, type = ro, optional = yes;
  BANK5:    load = BANK5, type = ro, optional = yes;
  BANK5R:   load = BANK5, type = ro, optional = yes;
  BANK6:    load = BANK6, type = ro, optional = yes;
  BANK6R:   load = BANK6, type = ro, optional = yes;
  STARTUP:  load = FIXED, type = ro;
  LOWCODE:  load = FIXED, type = ro, optional = yes;
  ONCE:     load = FIXED, type = ro, optional = yes;
  CODE:     load = FIXED, type = ro;
  RODATA:   load = FIXED, type = ro;
  DATA:     load = FIXED, run = WRAM, type = rw, define = yes, optional = yes;
  VECTORS:  load = VEC,  type = ro;
  CHARS:    load = CHR,  type = ro;
  BSS:      load = WRAM, type = bss, define = yes;
}
